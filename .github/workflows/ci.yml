name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    name: Install & smoke-test backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-lock.txt

      - name: Copy env example
        run: cp .env.example .env

      - name: Import check – backend modules
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          python -c "import models, database, auth, main; print('All backend modules imported OK')"

      - name: Start backend and health-check
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          python main.py &
          SERVER_PID=$!
          echo "Started server with PID $SERVER_PID"
          # Wait up to 15 s for the /docs endpoint to respond
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/docs > /dev/null; then
              echo "Server is up after ${i}s"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
