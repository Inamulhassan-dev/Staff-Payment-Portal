<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Staff Payment Portal</title>
    <link rel="stylesheet" href="css/style.css?v=2.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
        <i class="fas fa-moon"></i>
    </button>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="fas fa-wallet"></i>
                <h1>Staff Payment Portal</h1>
                <p>Secure Payroll Management System</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" name="username" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div id="message" style="margin-top: 15px; text-align: center;"></div>
            
            <div style="margin-top: 20px; text-align: center; color: #6b7280; font-size: 14px;">
                <p>Default Login:</p>
                <p><strong>Email:</strong> admin@staff.com</p>
                <p><strong>Password:</strong> admin123</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const messageDiv = document.getElementById('message');
            
            try {
                const response = await fetch('http://localhost:8000/api/login', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    messageDiv.innerHTML = '<p style="color: green;">Login successful! Redirecting...</p>';
                    
                    setTimeout(() => {
                        if (data.user.role === 'admin' || data.user.role === 'hr') {
                            window.location.href = 'admin/dashboard.html';
                        } else {
                            window.location.href = 'staff/dashboard.html';
                        }
                    }, 1000);
                } else {
                    messageDiv.innerHTML = `<p style="color: red;">${data.detail}</p>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<p style="color: red;">Connection error. Please check if backend is running.</p>';
            }
        });
    </script>
    <script src="js/app.js"></script>
</body>
</html>
