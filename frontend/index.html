<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Payment Portal</title>
    <link rel="stylesheet" href="css/style.css?v=2.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card" style="text-align: center;">
            <div class="logo">
                <i class="fas fa-wallet"></i>
                <h1>Staff Payment Portal</h1>
                <p>Secure Payroll Management System</p>
            </div>
            
            <div style="margin: 30px 0;">
                    <a href="login.html" class="btn btn-primary" style="display: block; text-decoration: none; text-align: center;">
                    <i class="fas fa-sign-in-alt"></i> Login to Portal
                </a>
            </div>
            
            <div style="margin-top: 30px; text-align: left; padding: 20px; background: var(--light); border-radius: 10px;">
                <h3 style="margin-bottom: 15px;"><i class="fas fa-info-circle"></i> Features</h3>
                <ul style="list-style: none; padding: 0;">
                    <li style="padding: 8px 0;"><i class="fas fa-check" style="color: var(--success); margin-right: 10px;"></i> Admin & Staff Dashboards</li>
                    <li style="padding: 8px 0;"><i class="fas fa-check" style="color: var(--success); margin-right: 10px;"></i> Automated Salary Calculations</li>
                    <li style="padding: 8px 0;"><i class="fas fa-check" style="color: var(--success); margin-right: 10px;"></i> Digital Payslip Generation</li>
                    <li style="padding: 8px 0;"><i class="fas fa-check" style="color: var(--success); margin-right: 10px;"></i> Payment History Tracking</li>
                    <li style="padding: 8px 0;"><i class="fas fa-check" style="color: var(--success); margin-right: 10px;"></i> Modern Responsive UI</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
